server:
  port: 8080
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/disputes}
    username: ${DB_USERNAME:disputes}
    password: ${DB_PASSWORD:disputes}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_BYTES:10485760}
      max-request-size: ${MAX_UPLOAD_BYTES:10485760}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  upload-dir: ${UPLOAD_DIR:./uploads}
  max-upload-bytes: ${MAX_UPLOAD_BYTES:10485760}
